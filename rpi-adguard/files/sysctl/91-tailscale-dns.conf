# Installed to /etc/sysctl.d/91-tailscale-dns.conf by bootstrap.sh when Tailscale is enabled.
# AdGuard Home binds to the Pi's Tailscale IP, which only exists once tailscaled is
# connected. Allowing the bind beforehand keeps AdGuard Home (and LAN DNS) starting
# at boot even when Tailscale is slow or the internet is down.
net.ipv4.ip_nonlocal_bind = 1
