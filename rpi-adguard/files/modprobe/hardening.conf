# Installed to /etc/modprobe.d/hardening.conf by bootstrap.sh.
# Kernel modules this Pi never needs: rare network protocols (old remote bugs)
# and exotic filesystems. USB storage stays allowed: the Pi may boot from a USB SSD.
blacklist dccp
install dccp /bin/false
blacklist sctp
install sctp /bin/false
blacklist rds
install rds /bin/false
blacklist tipc
install tipc /bin/false
blacklist cramfs
install cramfs /bin/false
blacklist freevxfs
install freevxfs /bin/false
blacklist jffs2
install jffs2 /bin/false
blacklist hfs
install hfs /bin/false
blacklist hfsplus
install hfsplus /bin/false
